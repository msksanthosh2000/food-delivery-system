<main class="main-content">

  <div class="restaurant-grid">

    <div class="restaurant-card" *ngFor="let restaurant of restaurantList">

      <!-- IMAGE -->
      <div class="restaurant-image">
        <!-- <img [src]="'assets/restaurant-pics/' + getRandomImage()" alt="restaurant"> -->
         <!-- <img [src]="'https://source.unsplash.com/400x300/?food,restaurant,' + restaurant.id"> -->
          <!-- <img [src]="'https://picsum.photos/400/300?random=' + restaurant.id"> -->
           <!-- <img src="https://source.unsplash.com/400x300/?food" /> -->
            <img [src]="restaurant.image" alt="restaurant" />
      </div>

      <!-- DETAILS -->
      <div class="restaurant-details">

        <h3 class="restaurant-name">{{ restaurant.name }}</h3>

        <div class="restaurant-rating">
          <span class="rating">⭐ 4.5</span>
          <span class="rating-count">(500+)</span>
        </div>

        <button class="order-btn" (click)="onButtonClick(restaurant.id)">
          Order Now
        </button>

      </div>

    </div>

  </div>

</main>
