eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  datasource:
    url: jdbc:postgresql://localhost:5432/foodcataloguedb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect